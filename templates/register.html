<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <title>Registro</title>
</head>
<body class="landing-body">

    <header>
        <div class="logo-container">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="FIC CedearPy Logo" class="app-logo">
            </a>
        </div>
        <nav>
            <a href="#contacto" class="btn-contact-header"><i class="fas fa-envelope"></i> Contacto</a>
            <a href="{{ url_for('auth.login') }}" class="nav-link"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</a>
            </nav>
    </header>
    
    <main>
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <form action="{{ url_for('auth.register') }}" method="post">
                <div class="input-group">
                    <label for="user">Usuario</label>
                    <div class="input-wrapper">
                        <span class="moneda"><i class="fas fa-user" style="font-size: 0.8rem;"></i></span>
                        <input type="text" id="user" name="user" placeholder="Ingrese usuario..."
                        pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+" 
                        title="Por favor, ingresa solo letras y espacios." required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="moneda"><i class="fas fa-at" style="font-size: 0.8rem;"></i></span>
                        <input type="email" name="email" id="email" placeholder="Ingrese email..." required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="moneda"><i class="fas fa-lock" style="font-size: 0.8rem;"></i></span>
                        <input type="password" name="password" id="password" placeholder="Ingrese contraseña..." required>
                        <i class="fas fa-eye ojo-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="action-buttons">
                    <input type="submit" value="Crear cuenta">
                </div>
            </form>
            <div class="auth-footer">
                ¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a>
            </div>
        </div>
    </main>

    <footer id="contacto">
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://www.linkedin.com/in/mariano-borgini-dev" target="_blank" class="social-btn linkedin">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/marianoborgini1" target="_blank" class="social-btn github">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=marianoborgini1@gmail.com" target="_blank" class="social-btn gmail">
                    <i class="fas fa-envelope"></i> Gmail
                </a>
            </div>
            <div class="footer-copy">
                <p>Mariano Borgini <span class="code-tag">&lt;/&gt;</span> Software Developer</p>
                <small>Todos los derechos reservados © 2026</small>
            </div>
        </div>
    </footer>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
