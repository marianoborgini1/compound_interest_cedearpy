<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Iniciar Sesión</title>
</head>
<body>

    <header>
        <h1>Simulador FIC</h1>
        <nav>
            <a href="/login">Iniciar Sesión</a>
            <a href="/registro">Registrarse</a>
        </nav>
    </header>
    
    <main>
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>
            <form action="/login" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ingrese email..." required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Ingrese contraseña..." required>
                </div>

                <input type="submit" value="Ingresar">
            </form>
            <div class="auth-footer">
                ¿No tenés cuenta? <a href="/registro">Registrate acá</a>
            </div>
        </div>
    </main>

</body>
</html>
