<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_sin_txt.ico') }}">
    <title>Nueva Contraseña - CedearPy</title>
</head>
<body class="landing-body">

    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="app-logo">
        </div>
    </header>
    
    <main>
        <div class="auth-card">
            <h2>Nueva Contraseña</h2>
            <p style="text-align:center; color:#94a3b8; margin-bottom:1.5rem;">Crea tu nueva clave de acceso</p>

            <form method="post">
                <div class="input-group">
                    <label>Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <span class="moneda"><i class="fas fa-lock" style="font-size: 0.8rem;"></i></span>
                        <input type="password" name="password" id="new_password" placeholder="Ingresá la nueva clave..." required>
                        <i class="fas fa-eye ojo-password" id="toggleNewPassword"></i>
                    </div>
                </div>

                <div class="action-buttons">
                    <input type="submit" value="Guardar Contraseña">
                </div>
            </form>
        </div>
    </main>

    <footer id="contacto">
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://www.linkedin.com/in/mariano-borgini-dev" target="_blank" class="social-btn linkedin">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/marianoborgini1" target="_blank" class="social-btn github">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=marianoborgini1@gmail.com" target="_blank" class="social-btn gmail">
                    <i class="fas fa-envelope"></i> Gmail
                </a>
            </div>
            <div class="footer-copy">
                <p>Mariano Borgini <span class="code-tag">&lt;/&gt;</span> Software Developer</p>
                <small>Todos los derechos reservados © 2026</small>
            </div>
        </div>
    </footer>

    <script>
        const toggleNewPassword = document.querySelector('#toggleNewPassword');
        const newPassword = document.querySelector('#new_password');

        toggleNewPassword.addEventListener('click', function (e) {
            const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            newPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>

    
</body>
</html>
