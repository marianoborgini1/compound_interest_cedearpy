<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Registro</title>
</head>
<body>

    <header>
        <h1>Simulador FIC</h1>
        <nav>
            <a href="/login">Iniciar Sesión</a>
            <a href="/registro">Registrarse</a>
        </nav>
    </header>
    
    <main>
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <form action="/registro" method="post">
                <div class="input-group">
                    <label for="user">Usuario</label>
                    <input type="text" id="user" name="user" placeholder="Ingrese usuario..."
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+" 
                    title="Por favor, ingresa solo letras y espacios." required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ingrese email..." required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Ingrese contraseña..." required>
                </div>

                <input type="submit" value="Crear cuenta">
            </form>
            <div class="auth-footer">
                ¿Ya tenés cuenta? <a href="/login">Iniciá sesión</a>
            </div>
        </div>
    </main>

</body>
</html>
